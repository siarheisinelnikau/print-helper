[package]
name = "print-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Prepare clear, economical print layouts"
repository = "https://github.com/siarheisinelnikau/print-helper"
rust-version = "1.92"

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dependencies]
anyhow = "1"
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
flate2 = "1"

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }

rfd = "0.15.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3.5"

[target.'cfg(windows)'.dependencies]
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62.2", features = ["Data_Pdf", "Storage_Streams", "Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_Xps"] }

[profile.release]
strip = "debuginfo"

[profile.dev.package.egui_software_backend]
opt-level = 3
